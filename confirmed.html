<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Confirmed — Rocklands</title>
<style>
  :root {
    --bg: #f5f2ec;
    --ink: #1c1a17;
    --muted: #6b6459;
    --accent: #b5502e;
    --card: #ffffff;
    --good: #3f7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f;
      --ink: #f2ede4;
      --muted: #a89e8d;
      --accent: #e08a5c;
      --card: #221e18;
      --good: #6fbf82;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }
  main { max-width: 420px; width: 100%; }
  .check {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--good);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 32px;
  }
  h1 {
    font-size: clamp(1.6rem, 5vw, 2.1rem);
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  p {
    color: var(--muted);
    line-height: 1.5;
    margin: 0 0 28px;
  }
  a.button {
    display: inline-block;
    background: var(--accent);
    color: white;
    text-decoration: none;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 10px;
  }
  .fallback {
    margin-top: 20px;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <div class="check">&#10003;</div>
  <h1>Email confirmed</h1>
  <p>Your Rocklands account is ready. Head back to the app and sign in with the email and password you signed up with.</p>
  <a class="button" href="mobile://" id="open-app">Open Rocklands</a>
  <p class="fallback">Nothing happened? Just reopen Rocklands from your home screen.</p>
</main>
</body>
</html>
